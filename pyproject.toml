[project]
name = "seetapsych-gaze-follow"
description = "Gaze following estimation modules for SeetaPsych"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "seetapsych-lib",
]

[project.optional-dependencies]
all = [
    "einops>=0.8.2",
    "hydra-core>=1.3.5",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.123",
]
dev = [
    "seetapsych-gaze-follow[all]",
    "build>=1.4.4",
    "twine>=6.2.0",
    "scipy-stubs>=1.15.3.0",
]

[dependency-groups]
dev = [
    "seetapsych-gaze-follow[dev]",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_gaze_follow/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_gaze_follow"]

[tool.hatch.build.targets.wheel.package-data]
seetapsych_gaze_follow = ["modules/**/*.yml"]

torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
